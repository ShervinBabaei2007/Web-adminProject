<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkLocker</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main>
        <h1>LinkLocker</h1>

        <div id="auth-bar">
            <a id="login-link" href="/auth/google" hidden>Sign in with Google</a>
            <span id="user-info" hidden>
                <span id="user-name"></span>
                <button type="button" id="logout-button">Sign out</button>
            </span>
        </div>

        <p id="login-prompt" hidden>Sign in to create short links.</p>

        <form id="shorten-form" hidden>
            <input
                id="destination-url"
                type="url"
                name="url"
                aria-label="Long URL"
                placeholder="Paste a long URL"
                required
            >

            <button type="submit">
                Shorten Link
            </button>
        </form>

        <p id="form-message" role="status" aria-live="polite" hidden></p>
        <p id="short-link-result" hidden>
            <a id="short-link" href=""></a>
        </p>
    </main>

    <script src="/mainApp.js" defer></script>

</body>
</html>
