<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkLocker</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main>
        <h1>LinkLocker</h1>

        <form>
            <input
                type="url"
                placeholder="Paste a long URL"
                required
            >

            <button type="submit">
                Shorten Link
            </button>
        </form>
    </main>

    <script src="mainApp.js"></script>

</body>
</html>
