<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkLocker</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main>
        <h1>LinkLocker</h1>

        <form id="shorten-form">
            <input
                id="destination-url"
                type="url"
                name="url"
                aria-label="Long URL"
                placeholder="Paste a long URL"
                required
            >

            <button type="submit">
                Shorten Link
            </button>
        </form>

        <p id="form-message" role="status" aria-live="polite" hidden></p>
        <p id="short-link-result" hidden>
            <a id="short-link" href=""></a>
        </p>
    </main>

    <script src="/mainApp.js" defer></script>

</body>
</html>
