# https server for the site
server {
    # the domain name of the deployed app
    server_name linklocker.northcentralus.cloudapp.azure.com;

    # reqs  coming into site
    location / {

        # forward reqs to express app (exprss runs on port 3000)
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # give client ip to express also we do rate limting
        proxy_set_header X-Real-IP $remote_addr;

        # so express doesnt just see liek req form http://127.0.0.1/ also we do rate limiting too
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        #from http or https (we dont rlly need this right now, and we dont rely on it or anything, but in the futurue like for milestone B if we do auth or smth we migth need it)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # certbot. listens on port 443 for https

    # the cert used fro https our CA is lets encrypt
    # like so the brwoser can verify the site is okay like with lets encrypt signed cert
    ssl_certificate /etc/letsencrypt/live/linklocker.northcentralus.cloudapp.azure.com/fullchain.pem; 

    # pprivate key used by nginx for tls
    ssl_certificate_key /etc/letsencrypt/live/linklocker.northcentralus.cloudapp.azure.com/privkey.pem;

  
    include /etc/letsencrypt/options-ssl-nginx.conf;

    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# http server
server {

    # redirect req to https
    # 301 means the redirect is permanent
    if ($host = linklocker.northcentralus.cloudapp.azure.com) {
        return 301 https://$host$request_uri;
    }

    # listen to unnencrypt traffic http on port 80
    listen 80;

    # domain name for http reqs
    server_name linklocker.northcentralus.cloudapp.azure.com;

    # if no req matches return 404
    return 404;
}
